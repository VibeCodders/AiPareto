name: Refresh model data

on:
  schedule:
    # 05:00 UTC daily — OpenRouter/Artificial Analysis catalogs move slowly,
    # once a day is enough to stay current without hammering their pages.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # The VibeCodders org disables write access for the default GITHUB_TOKEN (Settings ->
      # Actions -> General -> Workflow permissions is locked to read-only org-wide), so pushing
      # requires a personal access token instead. Add one as a repo secret named DATA_REFRESH_PAT
      # (Settings -> Secrets and variables -> Actions -> New repository secret), scoped to just
      # this repo's contents (fine-grained PAT) or with the classic "repo" scope. Until that
      # secret exists, this job still fetches/typechecks/builds but the push step below fails.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.DATA_REFRESH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest model data
        id: fetch
        run: npm run fetch-data

      - name: Typecheck
        if: steps.fetch.outputs.changed == 'true'
        run: npx tsc -b

      - name: Build (sanity check before committing)
        if: steps.fetch.outputs.changed == 'true'
        run: npm run build

      # A PAT-authenticated push is a normal user push as far as GitHub is concerned, so it
      # triggers deploy.yml's `on: push` by itself — no need to invoke it explicitly (which is
      # what you'd otherwise need `gh workflow run` + an actions:write token for).
      - name: Commit and push
        if: steps.fetch.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.fetch.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/models.json src/data/meta.json
          git commit -m "chore: daily model data refresh" -m "$SUMMARY"
          git push
