name: Refresh model data

on:
  schedule:
    # 05:00 UTC daily — OpenRouter/Artificial Analysis catalogs move slowly,
    # once a day is enough to stay current without hammering their pages.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest model data
        id: fetch
        run: npm run fetch-data
        env:
          GITHUB_OUTPUT: ${{ github.output }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}

      - name: Assert no models removed
        if: always()
        run: |
          removed="${{ steps.fetch.outputs.removed_count }}"
          if [ "$removed" -gt 0 ]; then
            echo "FAIL: $removed models were removed from models.json. Preservation guarantee violated."
            exit 1
          fi
          echo "PASS: No models removed (preserved ${{ steps.fetch.outputs.preserved_count }} from previous run)."

      - name: Typecheck
        if: steps.fetch.outputs.changed == 'true'
        run: npx tsc -b

      - name: Build (sanity check before committing)
        if: steps.fetch.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push
        if: steps.fetch.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.fetch.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/models.json src/data/meta.json
          git commit -m "chore: daily model data refresh" -m "$SUMMARY"
          git push

      # Pushes made with the default GITHUB_TOKEN don't trigger other workflows'
      # `on: push` (GitHub's loop-prevention, independent of the token's permission level),
      # so deploy.yml wouldn't fire on its own — kick it off explicitly instead of
      # duplicating its build/deploy steps here.
      - name: Trigger Pages deployment
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref ${{ github.ref_name }}
